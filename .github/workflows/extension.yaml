name: Extension

on:
  pull_request:
  push:
    branches:
      - main
    tags: ["*"]

env:
  RETENTION_DAYS_PR: 2
  RETENTION_DAYS_MAIN: 30
  RETENTION_DAYS_TAG: 90

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository (fast)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check out repository (deep)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .tool-versions

      - name: Install dependencies
        run: pnpm install

      - name: Set extension version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          ## Remove leading 'v' if present
          VERSION="${TAG_VERSION#v}"
          echo "WXT_EXTENSION_VERSION_NAME=$VERSION" >> $GITHUB_ENV

      - name: Set git commit hash for PR builds
        if: github.event_name == 'pull_request'
        run: |
          ## Use the actual PR head commit, not GitHub's merge commit
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"

          echo "WXT_PR_BRANCH_COMMIT_HASH=$PR_HEAD" >> $GITHUB_ENV

          ## Check if PR is behind base by counting commits in base that aren't in PR
          ## If there are commits in base..PR_HEAD (i.e., base is ahead), PR is behind
          COMMITS_BEHIND=$(git rev-list --count "$PR_HEAD..$BASE_REF")
          if [ "$COMMITS_BEHIND" -gt 0 ]; then
            echo "WXT_PR_BEHIND_BASE=true" >> $GITHUB_ENV
          fi

      - name: Run `pnpm zip`
        run: pnpm zip

      - name: Prepare artifacts
        id: config
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "retention_days=${{ env.RETENTION_DAYS_TAG }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "retention_days=${{ env.RETENTION_DAYS_PR }}" >> $GITHUB_OUTPUT
          else
            echo "retention_days=${{ env.RETENTION_DAYS_MAIN }}" >> $GITHUB_OUTPUT
          fi

          ## Reason for file extraction: https://github.com/actions/upload-artifact/issues/3

          ## Find Chrome extension and extract it
          CHROME_FILE=$(ls -t dist/botnadzor-for-chrome-*.zip | grep -v sources | head -1)
          CHROME_NAME=$(basename "$CHROME_FILE" .zip)
          mkdir -p "artifacts/$CHROME_NAME"
          unzip -q "$CHROME_FILE" -d "artifacts/$CHROME_NAME"
          echo "chrome_name=$CHROME_NAME" >> $GITHUB_OUTPUT

          ## Find Firefox extension and extract it
          FIREFOX_FILE=$(ls -t dist/botnadzor-for-firefox-*.zip | grep -v sources | head -1)
          FIREFOX_NAME=$(basename "$FIREFOX_FILE" .zip)
          mkdir -p "artifacts/$FIREFOX_NAME"
          unzip -q "$FIREFOX_FILE" -d "artifacts/$FIREFOX_NAME"
          echo "firefox_name=$FIREFOX_NAME" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ## Find Chrome sources and extract them
            CHROME_SOURCES_FILE=$(ls -t dist/botnadzor-for-chrome-*.sources.zip | head -1)
            CHROME_SOURCES_NAME=$(basename "$CHROME_SOURCES_FILE" .zip)
            mkdir -p "artifacts/$CHROME_SOURCES_NAME"
            unzip -q "$CHROME_SOURCES_FILE" -d "artifacts/$CHROME_SOURCES_NAME"
            echo "chrome_sources_name=$CHROME_SOURCES_NAME" >> $GITHUB_OUTPUT

            ## Find Firefox sources and extract them
            FIREFOX_SOURCES_FILE=$(ls -t dist/botnadzor-for-firefox-*.sources.zip | head -1)
            FIREFOX_SOURCES_NAME=$(basename "$FIREFOX_SOURCES_FILE" .zip)
            mkdir -p "artifacts/$FIREFOX_SOURCES_NAME"
            unzip -q "$FIREFOX_SOURCES_FILE" -d "artifacts/$FIREFOX_SOURCES_NAME"
            echo "firefox_sources_name=$FIREFOX_SOURCES_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Upload extension as artifact for Chrome
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.config.outputs.chrome_name }}
          path: artifacts/${{ steps.config.outputs.chrome_name }}
          retention-days: ${{ steps.config.outputs.retention_days }}

      - name: Upload extension as artifact for Firefox
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.config.outputs.firefox_name }}
          path: artifacts/${{ steps.config.outputs.firefox_name }}
          retention-days: ${{ steps.config.outputs.retention_days }}

      - name: Upload extension sources as artifact for Chrome
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.config.outputs.chrome_sources_name }}
          path: artifacts/${{ steps.config.outputs.chrome_sources_name }}
          retention-days: ${{ steps.config.outputs.retention_days }}

      - name: Upload extension sources as artifact for Firefox
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.config.outputs.firefox_sources_name }}
          path: artifacts/${{ steps.config.outputs.firefox_sources_name }}
          retention-days: ${{ steps.config.outputs.retention_days }}
