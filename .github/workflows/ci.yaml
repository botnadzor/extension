name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags: ["*"]

env:
  ARTIFACT_RETENTION_DAYS_PR: 2
  ARTIFACT_RETENTION_DAYS_MAIN: 30
  ARTIFACT_RETENTION_DAYS_TAG: 90

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check out repository (fast)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Check out repository (deep)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version-file: .tool-versions

      - name: Install dependencies
        run: pnpm install

      - name: Set extension version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          ## Remove leading 'v' if present
          VERSION="${TAG_VERSION#v}"
          echo "WXT_EXTENSION_VERSION_NAME=$VERSION" >> $GITHUB_ENV

      - name: Set git commit hash for PR builds
        if: github.event_name == 'pull_request'
        run: |
          ## Use the actual PR head commit, not GitHub's merge commit
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"

          echo "WXT_PR_BRANCH_COMMIT_HASH=$PR_HEAD" >> $GITHUB_ENV

          ## Check if PR is behind base by counting commits in base that aren't in PR
          ## If there are commits in base..PR_HEAD (i.e., base is ahead), PR is behind
          COMMITS_BEHIND=$(git rev-list --count "$PR_HEAD..$BASE_REF")
          if [ "$COMMITS_BEHIND" -gt 0 ]; then
            echo "WXT_MERGED_WITH_BASE=true" >> $GITHUB_ENV
          fi

      - name: Run `pnpm zip`
        run: pnpm zip

      - name: Prepare artifacts
        id: config
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "retention_days=${{ env.ARTIFACT_RETENTION_DAYS_TAG }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "retention_days=${{ env.ARTIFACT_RETENTION_DAYS_PR }}" >> $GITHUB_OUTPUT
          else
            echo "retention_days=${{ env.ARTIFACT_RETENTION_DAYS_MAIN }}" >> $GITHUB_OUTPUT
          fi

          CHROME_FILE=$(ls -t dist/botnadzor-for-chrome-*.zip | grep -v sources | head -1)
          echo "chrome_file=$CHROME_FILE" >> $GITHUB_OUTPUT
          echo "chrome_name=$(basename "$CHROME_FILE" .zip)" >> $GITHUB_OUTPUT

          FIREFOX_FILE=$(ls -t dist/botnadzor-for-firefox-*.zip | grep -v sources | head -1)
          echo "firefox_file=$FIREFOX_FILE" >> $GITHUB_OUTPUT
          echo "firefox_name=$(basename "$FIREFOX_FILE" .zip)" >> $GITHUB_OUTPUT

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            CHROME_SOURCES_FILE=$(ls -t dist/botnadzor-for-chrome-*.sources.zip | head -1)
            echo "chrome_sources_file=$CHROME_SOURCES_FILE" >> $GITHUB_OUTPUT
            echo "chrome_sources_name=$(basename "$CHROME_SOURCES_FILE" .zip)" >> $GITHUB_OUTPUT

            FIREFOX_SOURCES_FILE=$(ls -t dist/botnadzor-for-firefox-*.sources.zip | head -1)
            echo "firefox_sources_file=$FIREFOX_SOURCES_FILE" >> $GITHUB_OUTPUT
            echo "firefox_sources_name=$(basename "$FIREFOX_SOURCES_FILE" .zip)" >> $GITHUB_OUTPUT
          fi

      - name: Upload extension as artifact for Chrome
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.config.outputs.chrome_name }}
          path: ${{ steps.config.outputs.chrome_file }}
          archive: false
          retention-days: ${{ steps.config.outputs.retention_days }}

      - name: Upload extension as artifact for Firefox
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.config.outputs.firefox_name }}
          path: ${{ steps.config.outputs.firefox_file }}
          archive: false
          retention-days: ${{ steps.config.outputs.retention_days }}

      - name: Upload extension sources as artifact for Chrome
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.config.outputs.chrome_sources_name }}
          path: ${{ steps.config.outputs.chrome_sources_file }}
          archive: false
          retention-days: ${{ steps.config.outputs.retention_days }}

      - name: Upload extension sources as artifact for Firefox
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.config.outputs.firefox_sources_name }}
          path: ${{ steps.config.outputs.firefox_sources_file }}
          archive: false
          retention-days: ${{ steps.config.outputs.retention_days }}

      - name: Upload original zips for release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_name >= 'v0' && github.ref_name < 'va'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-zips
          path: dist/*.zip
          retention-days: ${{ steps.config.outputs.retention_days }}

      - name: Trigger release workflow
        if: startsWith(github.ref, 'refs/tags/v') && github.ref_name >= 'v0' && github.ref_name < 'va'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cd.yaml --ref "${{ github.ref }}" --field run_id="${{ github.run_id }}"

  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          cache: pnpm
          node-version-file: .tool-versions

      - name: Install dependencies
        run: pnpm install

      - name: Load CSpell cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          key: cspell-${{ github.run_id }}
          path: node_modules/.cache/cspell
          restore-keys: |
            cspell-

      - name: Run pnpm lint:cspell
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:cspell; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above errors locally for the check to pass.'
            echo 'If you don’t see them, try merging target branch into yours.'
            echo 'You can add exceptions to `cspell-words.txt`, if necessary.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:eslint
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:eslint; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:eslint` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:knip
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:knip; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:knip` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:pnpm-dedupe
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:pnpm-dedupe; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Some dependencies can be deduplicated, which will make pnpm-lock.yaml'
            echo 'lighter and potentially save us from unexplainable bugs.'
            echo 'Please run `pnpm fix:pnpm-dedupe` locally and commit pnpm-lock.yaml.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Load Prettier cache
        if: ${{ success() || failure() }}
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          key: prettier-${{ github.run_id }}
          path: node_modules/.cache/prettier
          restore-keys: |
            prettier-

      - name: Run pnpm lint:prettier
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:prettier; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:prettier` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:tsc
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:tsc; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above errors locally for the check to pass.'
            echo 'If you don’t see them, try merging target branch into yours.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm test:unit
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm test:unit; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above errors locally for the check to pass.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi
